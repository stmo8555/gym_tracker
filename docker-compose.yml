name: gym_tracker

services:
  # app:
  #   build: .
  #   restart: unless-stopped
  #   # .env holds the shared Postgres credentials (also used by the db service below).
  #   env_file:
  #     - .env
  #   environment:
  #     - POSTGRES_HOST=db        # the `db` service name resolves on the Compose network
  #     - POSTGRES_PORT=5432
  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
