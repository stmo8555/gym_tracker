<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <h1>Program days</h1>

  <form method="post" action="/program-days">
    <select name="programId">
      <option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.name}"></option>
    </select>
    <input type="number" name="dayOrder" placeholder="day order">
    <select name="workoutId">
      <option value="">-- no workout --</option>
      <option th:each="w : ${workouts}" th:value="${w.id}" th:text="${'workout ' + w.id}"></option>
    </select>
    <button>Add</button>
  </form>

  <ul>
    <li th:each="d : ${programDays}">
      <span th:text="${d.program.name}"></span>
      day <span th:text="${d.dayOrder}"></span>
      -
      <span th:text="${d.workout != null ? 'workout ' + d.workout.id : '(no workout)'}"></span>
      <a th:href="@{/program-days/{id}/edit(id=${d.id})}">edit</a>
      <form th:action="@{/program-days/{id}/delete(id=${d.id})}" method="post" style="display:inline">
        <button>delete</button>
      </form>
    </li>
  </ul>
</body>
</html>
