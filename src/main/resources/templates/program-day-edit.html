<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit program day')}"></head>

<body>
    <h1>Edit day [[${programDay.dayOrder}]]</h1>

    <form th:action="@{/programs/{pid}/program-days/{id}(pid=${program.id}, id=${programDay.id})}" method="post">
        <select name="workoutId">
            <option value="">Rest</option>
            <option th:each="w : ${workouts}" th:value="${w.id}" th:text="${w.name}"
                th:selected="${programDay.workout != null and w.id == programDay.workout.id}"></option>
        </select>
        <button>Save</button>
    </form>

    <a th:href="@{/programs/{id}/edit(id=${program.id})}">back</a>
</body>

</html>
