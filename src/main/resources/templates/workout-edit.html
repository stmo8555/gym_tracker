<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit workout')}"></head>

<body>
    <h1>Edit workout</h1>

    <form th:action="@{/workouts/{id}(id=${workout.id})}" method="post">
        <select name="programId">
            <option value="">-- no program --</option>
            <option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.name}"
                th:selected="${workout.program != null and p.id == workout.program.id}"></option>
        </select>
        <button>Save</button>
    </form>

    <ul>
        <li th:each="e : ${workout.exercises}">
            <span th:text="${e.name}"></span>
            (<span th:text="${e.sets}"></span> sets, <span th:text="${e.repRangeLower + '-' + e.repRangeUpper}"></span>
            reps)
            <a th:href="@{/exercises/{id}/edit(id=${e.id})}">edit</a>
            <form th:action="@{/exercises/{id}/delete(id=${e.id})}" method="post" style="display:inline">
                <button>delete</button>
            </form>
        </li>
    </ul>
    
    <form method="post" action="/exercises">
        <input name="name" placeholder="name">
        <input type="number" name="repRangeLower" placeholder="rep range lower">
        <input type="number" name="repRangeUpper" placeholder="rep range upper">
        <input type="number" name="sets" placeholder="sets">
        <input type="number" name="restSeconds" placeholder="rest seconds" value="0">
        <input name="note" placeholder="note (optional)">
        <input type="hidden" name="workoutId" th:value="${workout.id}">
        <button>Add</button>
    </form>

    <a href="/workouts">back</a>
</body>

</html>
