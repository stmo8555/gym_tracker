<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit workout')}"></head>

<body>
    <h1>Edit workout: <span th:text=${workout.name}></span></h1>

    <p th:unless="${programs.isEmpty()}">Used in:
        <th:block th:each="p, stat : ${programs}">
            <a th:href="@{/programs/{id}/edit(id=${p.id})}" th:text="${p.name}"></a><span th:unless="${stat.last}">, </span>
        </th:block>
    </p>

    <h2>Name</h2>

    <form method="post" th:action="@{/workouts/{id}/edit(id=${workout.id})}">
        <input name="name" th:value="${workout.name}" required>
        <button>Rename</button>
    </form>

    <h2>Exercises</h2>
    <p th:if="${exercises.isEmpty()}">No exercises yet</p>
    <ul>
        <li th:each="e : ${exercises}">
            <span th:text="${e.name}"></span>
            (<span th:text="${e.sets}"></span> sets, <span th:text="${e.repRangeLower + '-' + e.repRangeUpper}"></span>
            reps)
            <a th:href="@{/workouts/{wid}/exercises/{id}/edit(wid=${workout.id}, id=${e.id})}">edit</a>
            <form th:action="@{/workouts/{wid}/exercises/{id}/delete(wid=${workout.id}, id=${e.id})}" method="post"
                style="display:inline">
                <button>delete</button>
            </form>
        </li>
    </ul>

    <h2>Add Exercise</h2>
    <form method="post" th:action="@{/workouts/{id}/exercises(id=${workout.id})}">
        <input name="name" placeholder="name">
        <input type="number" name="repRangeLower" placeholder="rep range lower">
        <input type="number" name="repRangeUpper" placeholder="rep range upper">
        <input type="number" name="sets" placeholder="sets">
        <input type="number" name="restSeconds" placeholder="rest seconds" value="0">
        <input name="note" placeholder="note (optional)">
        <button>Add</button>
    </form>

    <a href="/workouts">back</a>
</body>

</html>
