<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit program')}"></head>

<body>
    <h1>Edit program: <span th:text="${program.name}"></span></h1>

    <h2>Program settings</h2>
    <form th:action="@{/programs/{id}(id=${program.id})}" method="post">
        <label>Name <input name="name" th:value="${program.name}"></label>
        <label><input type="checkbox" name="active" value="true" th:checked="${program.active}"> active</label>
        <label>Day <input type="number" name="day" th:value="${program.day}"></label>
        <span th:text="'Rot ' + ${program.rotationPos}"></span>
        <label>Rotations <input type="number" name="rotations" th:value="${program.rotations}"></label>
        <label>Deload interval <input type="number" name="deloadInterval" th:value="${program.deloadInterval}"></label>
        <button>Save</button>
    </form>

    <h2>Days</h2>

    <ul>
        <li th:each="d : ${programDays}">
            day <span th:text="${d.dayOrder}"></span>
            <span th:text="${d.workout != null ? 'workout ' + d.workout.name : '(no workout)'}"></span>
            <a th:href="@{/programs/{pid}/program-days/{id}/edit(pid=${program.id}, id=${d.id})}">edit</a>
            <form th:action="@{/programs/{pid}/program-days/{id}/delete(pid=${program.id}, id=${d.id})}" method="post" style="display:inline">
                <button>delete</button>
            </form>
        </li>
    </ul>

    <h2>Add Day</h2>

    <form method="post" th:action="@{/programs/{id}/program-days(id=${program.id})}">
        <!-- <select name="programId"> -->
        <!--     <option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.name}"></option> -->
        <!-- </select> -->
        <input type="number" name="dayOrder" placeholder="day order">
        <select name="workoutId">
            <option value="">-- no workout --</option>
            <option th:each="w : ${workouts}" th:value="${w.id}" th:text="${'workout ' + w.name}"></option>
        </select>
        <button>Add</button>
    </form>


    <a href="/programs">back</a>
</body>

</html>
