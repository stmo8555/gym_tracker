<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <h1>Programs</h1>

  <form method="post" action="/programs">
    <input name="name" placeholder="name">
    <button>Add</button>
  </form>

  <ul>
    <li th:each="p : ${programs}">
      <span th:text="${p.name}"></span>
      <a th:href="@{/programs/{id}/edit(id=${p.id})}">edit</a>
      <form th:action="@{/programs/{id}/delete(id=${p.id})}" method="post" style="display:inline">
        <button>delete</button>
      </form>
    </li>
  </ul>
</body>
</html>
